# Tests, lints, Windows cross-build and the license gate on every push/PR.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --locked --target x86_64-pc-windows-gnu -p flint-ui-win32 -p flint-preview -p flint-plugin-epoch
  windows:
    # Native Windows: the Win32 code paths that Linux and Wine cannot prove.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --workspace --locked --no-fail-fast
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check licenses
