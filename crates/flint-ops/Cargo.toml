[package]
name = "flint-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safe file operations: planning, revalidation, preview, compare and duplicate detection"

[dependencies]
flint-fuzzy = { version = "0.1.0", path = "../flint-fuzzy" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
