[package]
name = "flint-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Update checks: signed manifests, version policy, verified downloads"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.0.7"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "flint-release"
path = "src/bin/release.rs"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
