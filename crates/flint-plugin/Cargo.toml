[package]
name = "flint-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Out-of-process plugin host: manifests, approvals, versioned JSON protocol, confinement and recovery"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.0.7"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
