[package]
name = "flint-ui-win32"
version.workspace = true
edition.workspace = true

[dependencies]
flint-fuzzy = { version = "0.1.0", path = "../flint-fuzzy" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
