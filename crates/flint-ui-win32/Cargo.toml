[package]
name = "flint-ui-win32"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Release builds: no console window (the launcher lives in the background).
gui = []

[dependencies]
flint-commands = { version = "0.1.0", path = "../flint-commands" }
flint-config = { version = "0.1.0", path = "../flint-config" }
flint-fuzzy = { version = "0.1.0", path = "../flint-fuzzy" }
flint-index = { version = "0.1.0", path = "../flint-index" }
flint-ntfs = { version = "0.1.0", path = "../flint-ntfs" }
flint-ops = { version = "0.1.0", path = "../flint-ops" }
flint-preview = { version = "0.1.0", path = "../flint-preview" }
flint-plugin = { version = "0.1.0", path = "../flint-plugin" }
flint-update = { version = "0.1.0", path = "../flint-update" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_Ole", "Win32_System_SystemServices"] }
