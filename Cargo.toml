[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/24f2000058/windows-search"
rust-version = "1.87"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Shipped builds (tools/release.sh): release, without debug info.
[profile.dist]
inherits = "release"
debug = false
strip = true
