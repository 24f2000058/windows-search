# License gate (cargo-deny): every dependency must be under one of these
# permissive licenses. A new license needs an explicit decision here.
[graph]
targets = ["x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# The workspace's own crates.
crate = "flint-*"
expression = "MIT OR Apache-2.0"
license-files = []

[licenses.private]
ignore = true
